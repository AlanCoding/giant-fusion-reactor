[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "giant-fusion-cno"
version = "0.2.0"
description = "Auditable zero-dimensional physics and bookkeeping tools for engineered CNO cycles"
readme = "LIBRARY.md"
requires-python = ">=3.11"
dependencies = [
  "endf-parserpy>=0.17",
  "matplotlib>=3.11",
  "numpy>=2.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6",
  "jupyterlab>=4",
  "pandas>=2",
]
test = []

[project.scripts]
cno-sweep = "cno_sweep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cno_sweep = ["resources/**/*.json"]
