[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cno-static-sweep"
version = "0.1.0"
description = "Reproducible first-pass static implosion screening for the CNO study"
requires-python = ">=3.11"

[project.scripts]
cno-sweep = "cno_sweep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

